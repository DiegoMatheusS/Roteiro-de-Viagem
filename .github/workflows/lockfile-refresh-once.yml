name: Atualizar MapLibre - manutenção única
on:
  push:
    branches: [fix/api-resilience-security-oct18]
    paths: ['.github/workflows/lockfile-refresh-once.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-resilience-security-oct18
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply smallest patched MapLibre GL JS version
        run: npm install maplibre-gl@6.4.1 --save-exact --package-lock-only --ignore-scripts --no-audit
      - name: Commit the npm-generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade MapLibre GL JS to patched 6.4.1"
            git push origin HEAD:fix/api-resilience-security-oct18
          fi
