name: Preparar dependencias MapLibre (temporario)
on:
  push:
    branches: [feat/role-maplibre-vector-base-20261017]
    paths: [.github/workflows/maplibre-lock-temp.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --save-exact maplibre-gl@6.3.0 @maplibre/maplibre-gl-leaflet@0.1.4
      - uses: actions/upload-artifact@v4
        with:
          name: maplibre-package-lock
          path: |
            package.json
            package-lock.json
          retention-days: 3
      - name: Commit lockfile in feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(role): lock MapLibre dependencies for deterministic builds"
          git push origin HEAD:feat/role-maplibre-vector-base-20261017
