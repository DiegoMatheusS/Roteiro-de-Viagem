name: Validar backend Cloudflare
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar pacote e bindings sem publicar
        run: npm run cloudflare:check
      - name: Testar API no runtime Cloudflare com SQLite persistente
        run: npm run test:cloudflare
