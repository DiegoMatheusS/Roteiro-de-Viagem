name: Validar Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Origem HTTPS do backend para APK de teste
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
        env:
          RDV_API_URL: ${{ inputs.api_url || vars.RDV_API_URL }}
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: roteiro-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
