name: Validar Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Origem HTTPS do backend
        required: true
        type: string
      distribution:
        description: Tipo de pacote
        required: true
        default: debug
        type: choice
        options: [debug, release]
      version_code:
        description: Número de versão crescente para release
        required: false
        type: string
      version_name:
        description: Versão exibida no aplicativo
        required: false
        default: 0.5.0
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build
      - name: Validar e embutir endereço do backend
        run: npx cap sync android
        env:
          RDV_API_URL: ${{ inputs.api_url || vars.RDV_API_URL }}
      - run: chmod +x android/gradlew
      - name: Preparar assinatura persistente do APK de teste
        # Não expor chaves privadas aos workflows de PR: somente main ou execução manual.
        if: github.event_name != 'pull_request' && inputs.distribution != 'release'
        env:
          RDV_KEYSTORE_BASE64: ${{ secrets.RDV_KEYSTORE_BASE64 }}
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
        run: |
          if [ -n "$RDV_KEYSTORE_BASE64" ] && [ -n "$RDV_STORE_PASSWORD" ] && [ -n "$RDV_KEY_ALIAS" ] && [ -n "$RDV_KEY_PASSWORD" ]; then
            printf '%s' "$RDV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rdv-debug-stable.jks"
            chmod 600 "$RUNNER_TEMP/rdv-debug-stable.jks"
            echo "RDV_KEYSTORE_FILE=$RUNNER_TEMP/rdv-debug-stable.jks" >> "$GITHUB_ENV"
            echo "RDV_USE_STABLE_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "::notice::APK debug com assinatura persistente. Registre SHA-1 e pacote .debug no OAuth Android."
          else
            echo "::warning::APK debug com assinatura descartável: login Google código 10 até configurar uma chave persistente e registrar SHA-1 no Google Cloud."
          fi
      - name: Compilar APK de teste
        if: inputs.distribution != 'release'
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
        env:
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
          RDV_VERSION_CODE: ${{ github.run_number }}
          RDV_VERSION_NAME: ${{ inputs.version_name || '0.5.0' }}-test.${{ github.run_number }}
      - name: Validar APK e AAB com chave descartável de teste
        if: github.event_name != 'workflow_dispatch'
        working-directory: android
        env:
          RDV_KEYSTORE_FILE: ${{ runner.temp }}/rdv-ci.jks
          RDV_STORE_PASSWORD: fixture-only-ci
          RDV_KEY_ALIAS: ci
          RDV_KEY_PASSWORD: fixture-only-ci
          RDV_VERSION_CODE: ${{ github.run_number }}
          RDV_VERSION_NAME: 0.5.0-beta.1
        run: |
          trap 'rm -f "$RDV_KEYSTORE_FILE"; rm -rf app/build/outputs/apk/release app/build/outputs/bundle/release' EXIT
          keytool -genkeypair -noprompt -keystore "$RDV_KEYSTORE_FILE" -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI Teste Descartavel' -storepass "$RDV_STORE_PASSWORD" -keypass "$RDV_KEY_PASSWORD"
          ./gradlew :app:assembleRelease :app:bundleRelease
          mkdir -p ../android-dist
          cp app/build/outputs/apk/release/app-release.apk ../android-dist/roteiro-para-assinar.apk
          cp app/build/outputs/bundle/release/app-release.aab ../android-dist/roteiro-para-assinar.aab
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" ../android-dist/apksigner.jar
      - name: Preparar chave privada de release
        if: inputs.distribution == 'release'
        env:
          RDV_KEYSTORE_BASE64: ${{ secrets.RDV_KEYSTORE_BASE64 }}
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
        run: |
          test -n "$RDV_KEYSTORE_BASE64" && test -n "$RDV_STORE_PASSWORD" && test -n "$RDV_KEY_ALIAS" && test -n "$RDV_KEY_PASSWORD"
          printf '%s' "$RDV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rdv-release.jks"
          chmod 600 "$RUNNER_TEMP/rdv-release.jks"
      - name: Compilar APK e AAB assinados
        if: inputs.distribution == 'release'
        working-directory: android
        env:
          RDV_KEYSTORE_FILE: ${{ runner.temp }}/rdv-release.jks
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
          RDV_VERSION_CODE: ${{ inputs.version_code }}
          RDV_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$RDV_VERSION_CODE" && test -n "$RDV_VERSION_NAME"
          ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Conferir assinatura e identificar APK
        run: node scripts/android-artifact-info.mjs
        env:
          RDV_DISTRIBUTION: ${{ inputs.distribution || 'debug' }}
      - name: Disponibilizar pacote conectado ao backend
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          retention-days: 3
          name: roteiro-android-${{ inputs.distribution || 'debug' }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android-dist/
      - name: Disponibilizar APK de teste da PR
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          retention-days: 5
          name: role-android-pr-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-dist/apk-info.json
      - name: Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/rdv-release.jks" "$RUNNER_TEMP/rdv-debug-stable.jks"
