name: Validar Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: Origem HTTPS do backend
        required: true
        type: string
      distribution:
        description: Tipo de pacote
        required: true
        default: debug
        type: choice
        options: [debug, release]
      version_code:
        description: Número de versão crescente para release
        required: false
        type: string
      version_name:
        description: Versão exibida no aplicativo
        required: false
        default: 0.5.0
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run build
      - name: Validar e embutir endereço do backend
        run: npx cap sync android
        env:
          RDV_API_URL: ${{ inputs.api_url || vars.RDV_API_URL }}
      - run: chmod +x android/gradlew
      - name: Compilar APK de teste
        if: inputs.distribution != 'release'
        run: ./gradlew assembleDebug assembleDebugAndroidTest
        working-directory: android
      - name: Preparar chave privada de release
        if: inputs.distribution == 'release'
        env:
          RDV_KEYSTORE_BASE64: ${{ secrets.RDV_KEYSTORE_BASE64 }}
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
        run: |
          test -n "$RDV_KEYSTORE_BASE64" && test -n "$RDV_STORE_PASSWORD" && test -n "$RDV_KEY_ALIAS" && test -n "$RDV_KEY_PASSWORD"
          printf '%s' "$RDV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rdv-release.jks"
          chmod 600 "$RUNNER_TEMP/rdv-release.jks"
      - name: Compilar APK e AAB assinados
        if: inputs.distribution == 'release'
        working-directory: android
        env:
          RDV_KEYSTORE_FILE: ${{ runner.temp }}/rdv-release.jks
          RDV_STORE_PASSWORD: ${{ secrets.RDV_STORE_PASSWORD }}
          RDV_KEY_ALIAS: ${{ secrets.RDV_KEY_ALIAS }}
          RDV_KEY_PASSWORD: ${{ secrets.RDV_KEY_PASSWORD }}
          RDV_VERSION_CODE: ${{ inputs.version_code }}
          RDV_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$RDV_VERSION_CODE" && test -n "$RDV_VERSION_NAME"
          ./gradlew assembleRelease bundleRelease
      - name: Disponibilizar pacote conectado ao backend
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || vars.RDV_API_URL != ''
        with:
          retention-days: 3
          name: roteiro-android-${{ inputs.distribution || 'debug' }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/rdv-release.jks"
