def releaseStore = System.getenv('RDV_KEYSTORE_FILE')
def releaseSecrets = ['RDV_KEYSTORE_FILE','RDV_STORE_PASSWORD','RDV_KEY_ALIAS','RDV_KEY_PASSWORD'].collect { System.getenv(it) }
def signingReady = releaseSecrets.every { it != null && !it.isEmpty() }
def publishing = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (publishing && !signingReady) throw new GradleException('Configure a chave de assinatura antes de gerar o release.')
def appVersionCode = System.getenv('RDV_VERSION_CODE') ?: '1'
def appVersionName = System.getenv('RDV_VERSION_NAME') ?: '0.5.0'
if (!(appVersionCode ==~ /[1-9][0-9]{0,8}/)) throw new GradleException('RDV_VERSION_CODE deve ser um inteiro positivo.')

apply plugin: 'com.android.application'

android {
    namespace = "br.com.roteirodeviagem.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.roteirodeviagem.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady) {
            releaseKey { storeFile file(releaseStore); storePassword System.getenv('RDV_STORE_PASSWORD'); keyAlias System.getenv('RDV_KEY_ALIAS'); keyPassword System.getenv('RDV_KEY_PASSWORD') }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', 'Roteiro de Viagem (Teste)'
            // Sem uma chave persistente, cada runner assina o APK debug de forma diferente.
            // O Google OAuth Android exige PACKAGE + SHA-1 da assinatura cadastrados.
            if (signingReady && System.getenv('RDV_USE_STABLE_DEBUG_SIGNING') == '1')
                signingConfig signingConfigs.releaseKey
        }
        release {
            if (signingReady) signingConfig signingConfigs.releaseKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
